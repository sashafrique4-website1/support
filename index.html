<style>
  :root{
    --bg:#0a0908; --panel:#141210; --panel2:#1c1a17; --border:#2b2620;
    --gold:#FAB202; --gold-soft:#c98f10; --text:#f3f1ed; --muted:#a29a8c;
    --green:#3bc172; --red:#e0564f; --blue:#4d97e8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',Arial,sans-serif;font-size:14px;}
  h1,h2,h3,h4{font-family:'Playfair Display',serif;margin:0;}
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{background:#0d0c0a;border-right:1px solid var(--border);padding:22px 0;display:flex;flex-direction:column;}
  .sb-brand{padding:0 20px 22px 20px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .sb-brand .mark{width:38px;height:38px;border:2px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);margin-bottom:10px;}
  .sb-brand h1{font-size:16px;color:var(--gold);letter-spacing:.01em;}
  .sb-brand .tag{font-size:11px;color:var(--muted);margin-top:3px;}
  .sb-nav{flex:1;padding:0 12px;}
  .sb-nav button{width:100%;text-align:left;background:transparent;border:none;color:var(--muted);padding:11px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:3px;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;}
  .sb-nav button .ic{width:16px;text-align:center;opacity:.85;}
  .sb-nav button.active{background:#1c1a17;color:var(--gold);border-left:3px solid var(--gold);font-weight:600;}
  .sb-nav button:hover:not(.active){color:var(--text);}
  .sb-foot{padding:14px 20px 0 20px;border-top:1px solid var(--border);margin-top:10px;}
  .sb-foot .who{font-size:12.5px;color:var(--text);font-weight:600;}
  .sb-foot .role{font-size:11px;color:var(--muted);margin-bottom:10px;}

  /* TOPBAR */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;border-bottom:1px solid var(--border);background:#0d0c0a;}
  .greeting{font-family:'Playfair Display',serif;font-size:20px;}
  .greeting .sub{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .clockwrap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);padding:8px 14px;border-radius:30px;}
  .clockwrap .status{font-size:12px;color:var(--muted);}
  .clockwrap.in .status{color:var(--green);}
  .toggle{width:38px;height:20px;border-radius:20px;background:#2a2a2a;position:relative;cursor:pointer;transition:.2s;}
  .toggle.on{background:var(--green);}
  .toggle .knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.2s;}
  .toggle.on .knob{left:20px;}

  main{padding:24px 26px;max-width:1300px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:linear-gradient(180deg,#161410,var(--panel));border:1px solid var(--border);border-radius:12px;padding:18px;}
  .card .label{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .card .value{font-size:26px;font-weight:700;font-family:'Playfair Display',serif;}
  .card .sub{font-size:12px;color:var(--green);margin-top:5px;}
  .card.gold{border-color:var(--gold-soft);background:linear-gradient(160deg,#241c08,var(--panel));}
  .card.gold .value{color:var(--gold);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
  .panel h3{margin:0 0 14px 0;color:var(--gold);font-size:15px;font-family:'Playfair Display',serif;display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .toolbar input, .toolbar select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;}
  .toolbar input{flex:1;min-width:180px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tabs button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:20px;cursor:pointer;font-size:12.5px;}
  .tabs button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--border);}
  td{padding:11px 10px;border-bottom:1px solid #201e1a;font-size:13px;}
  tr:hover td{background:#1a1815;}
  .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block;}
  .b-pending{background:#3a2f00;color:#ffd254;}
  .b-reviewed{background:#1e2f45;color:#7fb3ff;}
  .b-designing{background:#2a1e45;color:#c39bff;}
  .b-paid{background:#1e3a2a;color:#7fe0a3;}
  .b-ready{background:#1e3a45;color:#7fd9ff;}
  .b-delivered{background:#153a1a;color:#5fd97a;}
  .b-new{background:#3a2f00;color:#ffd254;}
  .b-following{background:#1e2f45;color:#7fb3ff;}
  .b-converted{background:#153a1a;color:#5fd97a;}
  .b-lost{background:#3a1e1e;color:#ff8f8f;}
  .btn{background:var(--gold);color:#111;border:none;padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:.01em;}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold);}
  .btn.small{padding:5px 11px;font-size:11.5px;}
  .btn.red{background:var(--red);color:#fff;}
  .grid3{display:grid;grid-template-columns:1.05fr 1.35fr 1fr;gap:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:50px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .activity-item{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #201e1a;font-size:12.5px;}
  .activity-item .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:5px;flex-shrink:0;}
  .diff{background:#201a08;border:1px solid #3a2f00;border-radius:6px;padding:8px;font-size:11.5px;margin-top:5px;color:#ffd254;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:1120px;width:100%;}
  .modal.small{max-width:480px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .close-x{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
  .muted{color:var(--muted);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .stock-bar{height:6px;border-radius:3px;background:#221f1a;overflow:hidden;margin-top:7px;}
  .stock-fill{height:100%;background:var(--green);}
  .stock-fill.low{background:var(--red);}
  .pill{font-size:10.5px;padding:3px 9px;border-radius:20px;background:#221f1a;color:var(--muted);}
  .bar-track{background:#221f1a;border-radius:5px;height:8px;width:100%;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;background:var(--gold);}
  .note-banner{background:#101d0d;border:1px solid #204a19;color:#8fdc7a;padding:9px 13px;border-radius:8px;font-size:12px;margin-bottom:14px;}
  .proofs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px;}
  .proof-box{background:var(--panel2);border:1px dashed var(--border);border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;}
  .proof-box img{width:100%;height:100%;object-fit:cover;}
  .proof-box .ph{color:#555;font-size:24px;}
  .proof-label{font-size:10.5px;color:var(--muted);text-align:center;margin-top:5px;}
  ::placeholder{color:#5c574e;}
  .chat-thread{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;padding-right:4px;}
  .chat-msg{display:flex;gap:8px;max-width:88%;}
  .chat-msg.officer{align-self:flex-end;flex-direction:row-reverse;}
  .chat-msg .avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#1c1a17;border:1px solid var(--border);}
  .chat-msg .avatar.ph{display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:11px;font-weight:700;}
  .chat-bubble{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:12.5px;}
  .chat-msg.officer .chat-bubble{background:#241c08;border-color:var(--gold-soft);}
  .chat-time{font-size:10px;color:var(--muted);margin-top:3px;}
  .chat-input-row{display:flex;gap:8px;align-items:center;}
  .chat-input-row input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;}
  .customer-file{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;font-size:12.5px;}
</style>

<script>
/* ---------------- STATE ---------------- */
let clockedIn = false;
const AGENT_NAME = 'Esther Gyasi';
const LOGO_B64 = document.querySelector('.sb-brand img').src.split(',')[1];

/* ---------------- SMS (mNotify) ---------------- */
const MNOTIFY_API_KEY = 'wwoAcS6j2CsBVkXjOfS5T9Ic0';
const MNOTIFY_SENDER = 'SashAfrique';

function cleanPhoneForSMS(phone){
  if(!phone) return null;
  // strip anything that isn't a digit or leading +
  let p = phone.replace(/[^\d+]/g, '');
  if(p.startsWith('email_') || p.length < 9) return null; // not a real phone number
  return p;
}

async function sendSMS(phone, message){
  const cleaned = cleanPhoneForSMS(phone);
  if(!cleaned){
    console.warn('SMS skipped — no valid phone number:', phone);
    return { ok:false, reason:'invalid_phone' };
  }
  try {
    const res = await fetch(`https://api.mnotify.com/api/sms/quick?key=${MNOTIFY_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipient: [cleaned],
        sender: MNOTIFY_SENDER,
        message: message,
        is_schedule: false,
        schedule_date: ''
      })
    });
    if(!res.ok) throw new Error('mNotify request failed: ' + res.status);
    const data = await res.json();
    return { ok:true, data };
  } catch(err){
    console.error('SMS send error:', err);
    return { ok:false, reason:'network_or_cors', error: String(err) };
  }
}

// Editable automated SMS templates, one per order status.
// Placeholders: {name}, {order_id}, {delivery_mode}, {tracking_link}
let statusMessageTemplates = {
  pending:   'Hello {name}, thank you for your order (#{order_id}) with Sash Afrique. We are reviewing it and will be in touch shortly. Track and chat with us here: {tracking_link}',
  reviewed:  'Hello {name}, we have reviewed your order (#{order_id}). Please make payment to confirm and begin production. Track your order here: {tracking_link}',
  designing: 'Hello {name}, your order (#{order_id}) has been paid and is now in production. Track progress here: {tracking_link}',
  paid:      'Hello {name}, we have received payment for your order (#{order_id}). Track it here: {tracking_link}',
  ready:     'Hello {name}, your Sash Afrique order (#{order_id}) is ready for {delivery_mode}. Details here: {tracking_link}',
  delivered: 'Hello {name}, your Sash Afrique order (#{order_id}) has been delivered. Thank you for choosing us! {tracking_link}',
};

function trackingLinkFor(o){
  return `https://www.sashafrique.com/orders/client-tracking/${o.id}/`;
}

function fillTemplate(template, o){
  return template
    .replaceAll('{name}', o.achiever)
    .replaceAll('{order_id}', o.id)
    .replaceAll('{delivery_mode}', o.deliveryMode === 'pick_up' ? 'pickup' : 'delivery')
    .replaceAll('{tracking_link}', trackingLinkFor(o));
}

// Status-specific message, pulled from the editable templates above
function smsTemplateForStatus(o){
  const template = statusMessageTemplates[o.status] || 'Hello {name}, there is an update on your Sash Afrique order (#{order_id}).';
  return fillTemplate(template, o);
}

let enquiries = [];

const SAMPLE_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(`

  <circle cx="100" cy="100" r="70" fill="none" stroke="#FAB202" stroke-width="4"/>

  <text x="100" y="112" fill="#a29a8c" font-size="9" text-anchor="middle" font-family="Georgia">ACHIEVER'S CODE</text></svg>`);

const SAMPLE_PATTERN = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
  <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#111"/>
  <g stroke="#FAB202" stroke-width="3">
  <line x1="0" y1="20" x2="200" y2="20"/><line x1="0" y1="60" x2="200" y2="60"/>

/* ---------------- CLOCK IN/OUT + STRUCTURED BREAKS ---------------- */
const BREAK_ORDER = ['morning', 'lunch', 'afternoon'];
const BREAK_WINDOWS = { morning: '10:30', lunch: '12:30', afternoon: '15:30' };
const BREAK_ALLOWED = { morning: 15, lunch: 30, afternoon: 15 };
const BREAK_LABELS = { morning: 'Morning Break', lunch: 'Lunch Break', afternoon: 'Afternoon Break' };

let attendanceState = null;
let remindedWindow = {};
let remindedOverrun = {};

async function postAttendance_(action, extra){
  if(!ORDERS_ENDPOINT) return null;
  try{
    const res = await fetch(ORDERS_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action, staff: AGENT_NAME }, extra || {}))
    });
    return await res.json();
  }catch(err){
    console.warn('Could not reach attendance backend:', err);
    return null;
  }
}

async function loadAttendance(){
  if(!ORDERS_ENDPOINT) return;
  try{
    const res = await fetch(`${ORDERS_ENDPOINT}?action=getToday&staff=${encodeURIComponent(AGENT_NAME)}`);
    const data = await res.json();
    if(data.ok) attendanceState = data.attendance;
  }catch(err){
    console.warn('Could not load attendance:', err);
  }
  renderClockUI();
}

function renderClockUI(){
  const a = attendanceState;
  clockedIn = !!(a && a.clockIn && !a.clockOut);
  document.getElementById('clockToggle').classList.toggle('on', clockedIn);
  document.getElementById('clockStatus').textContent = clockedIn ? 'Clocked in' : 'Not clocked in';
  document.getElementById('clockwrap').classList.toggle('in', clockedIn);
  renderBreakChip();
}

async function toggleClock(){
  const res = await postAttendance_(clockedIn ? 'clockOut' : 'clockIn');
  if(res && res.ok) attendanceState = res.attendance;
  showToast(clockedIn ? 'Clocked out.' : 'Clocked in for today.');
  renderClockUI();
}

function renderBreakChip(){
  const a = attendanceState;
  const used = a ? a.totalBreakMinutesUsed : 0;
  const allowed = a ? a.totalBreakMinutesAllowed : 60;
  const chip = document.getElementById('breakChipLabel');
  if(chip) chip.textContent = `Breaks: ${used}/${allowed}`;
}

function toggleBreakPanel(){
  const panel = document.getElementById('breakPanel');
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'block' : 'none';
  if(show) renderBreakPanel();
}

function renderBreakPanel(){
  const a = attendanceState;
  const panel = document.getElementById('breakPanel');
  if(!a || !a.clockIn){
    panel.innerHTML = `<div class="muted" style="font-size:12px;">Clock in to see today's breaks.</div>`;
    return;
  }
  panel.innerHTML = `
    <div style="font-size:12.5px;font-weight:700;color:var(--gold);margin-bottom:10px;">Today's Breaks</div>
    ${BREAK_ORDER.map(key => {
      const b = a.breaks[key];
      let statusHtml, actionHtml;
      if(b.start && b.end){
        statusHtml = `<span style="color:var(--green);">Done — ${b.minutesUsed} min</span>`;
        actionHtml = '';
      } else if(b.start && !b.end){
        statusHtml = `<span style="color:var(--gold);">In progress</span>`;
        actionHtml = `<button class="btn ghost" style="padding:4px 10px;font-size:11px;" onclick="endBreak('${key}')">End</button>`;
      } else {
        statusHtml = `<span class="muted">Scheduled ${b.windowStart}</span>`;
        actionHtml = `<button class="btn ghost" style="padding:4px 10px;font-size:11px;" onclick="startBreak('${key}')">Start</button>`;
      }
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #201e1a;font-size:12px;">
        <div><div style="font-weight:600;">${b.label} <span class="muted">(${b.allowedMinutes}m)</span></div><div style="margin-top:2px;">${statusHtml}</div></div>
        ${actionHtml}
      </div>`;
    }).join('')}
    <div class="muted" style="font-size:11px;margin-top:8px;">${a.totalBreakMinutesUsed} of ${a.totalBreakMinutesAllowed} minutes used today</div>
  `;
}

async function startBreak(key){
  const res = await postAttendance_('startBreak', { breakKey: key });
  if(res && res.ok) attendanceState = res.attendance;
  renderBreakChip(); renderBreakPanel();
  showToast(`${BREAK_LABELS[key]} started.`);
}

async function endBreak(key){
  const res = await postAttendance_('endBreak', { breakKey: key });
  if(res && res.ok) attendanceState = res.attendance;
  renderBreakChip(); renderBreakPanel();
  showToast(`${BREAK_LABELS[key]} ended.`);
}

// Reminds her when a break window opens, and alerts when a running break's time is up.
function checkBreakAlerts(){
  if(!attendanceState || !attendanceState.clockIn || attendanceState.clockOut) return;
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  BREAK_ORDER.forEach(key => {
    const b = attendanceState.breaks[key];
    const [wh, wm] = BREAK_WINDOWS[key].split(':').map(Number);
    const windowMinutes = wh * 60 + wm;

    if(!b.start && nowMinutes >= windowMinutes && !remindedWindow[key]){
      remindedWindow[key] = true;
      showToast(`⏰ Time for your ${b.label} (${BREAK_ALLOWED[key]} min).`);
    }
    if(b.start && !b.end && !remindedOverrun[key]){
      const [sh, sm, ss] = b.start.split(':').map(Number);
      const startMinutes = sh * 60 + sm + (ss || 0) / 60;
      if(nowMinutes - startMinutes >= BREAK_ALLOWED[key]){
        remindedOverrun[key] = true;
        showToast(`⏰ Your ${b.label} time is up. Please resume work.`);
      }
    }
  });
}

}

async function saveOrder(id){
  const o = orders.find(x=>x.id===id);
  const before = {...o};
  const changes = [];
  const newVals = {
    achiever: document.getElementById('f_achiever').value,
    phone: document.getElementById('f_phone').value,
    address: document.getElementById('f_address').value,
    pattern: document.getElementById('f_pattern').value,
    left: document.getElementById('f_left').value,
    right: document.getElementById('f_right').value,
    method: document.getElementById('f_method').value,
    price: Number(document.getElementById('f_price').value),
    qty: Number(document.getElementById('f_qty').value),
    deliveryMode: document.getElementById('f_deliveryMode').value,
    delivery: Number(document.getElementById('f_delivery').value),
    status: document.getElementById('f_status').value,
  };
  Object.keys(newVals).forEach(k=>{
    if(String(before[k]) !== String(newVals[k])) changes.push(`${labelFor(k)}: "${before[k]}" → "${newVals[k]}"`);
  });
  Object.assign(o, newVals);
  pushFields(id, {
    achiever: newVals.achiever, phone: newVals.phone, address: newVals.address,
    pattern: newVals.pattern, left: newVals.left, right: newVals.right,
    method: newVals.method, price: newVals.price, qty: newVals.qty,
    deliveryMode: newVals.deliveryMode, delivery: newVals.delivery
  });
  if(before.status !== newVals.status) pushStatus(id, newVals.status);
  const now = new Date();
  const timeStr = now.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const notifyProduction = document.getElementById('f_notifyProduction').checked;
  const notify = document.getElementById('f_notifyAchiever').checked;
  if(changes.length){
    o.activity.push({
      t:timeStr,
      text:`Order updated by Esther Gyasi${notifyProduction ? ' — production notified' : ' — production not notified'}`,
      diff:changes.join(' · ')
    });
  } else {
    o.activity.push({t:timeStr, text:'Order reviewed, no changes made'});
  }
  closeOrder(); renderMain();
  showToast(changes.length
    ? `Order ${id} updated.${notifyProduction?' Production notified.':''}${notify?' Sending SMS to achiever...':''}`
    : `Order ${id} saved.`);

  if(changes.length && notify){
    const message = smsTemplateForStatus(o);
    const result = await sendSMS(o.phone, message);
    const now2 = new Date();
    const activityTime = now2.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const chatTime = now2.toLocaleString('en-US',{weekday:'short',month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'});
    if(result.ok){
      o.activity.push({t: activityTime, text: 'SMS sent to achiever', diff: message});
      o.chat = o.chat || [];
      o.chat.push({from:'officer', text: message, t: chatTime});
      showToast(`SMS sent to ${o.achiever}.`);
    } else if(result.reason === 'invalid_phone'){
      o.activity.push({t: activityTime, text: 'SMS not sent — no valid phone number on file', diff: message});
      showToast(`Could not send SMS — no valid phone number on file for ${o.achiever}.`);
    } else {
      o.activity.push({t: activityTime, text: 'SMS failed to send', diff: message});
      showToast(`SMS failed to send (this preview environment may block outside API calls — this will work once wired into your Apps Script backend).`);
    }
  }
}
function labelFor(k){
  const map = {achiever:'Achiever',phone:'Phone',address:'Address',pattern:'Pattern',left:'Left Inscription',right:'Right Inscription',method:'Method',price:'Price Each',qty:'Quantity',deliveryMode:'Delivery Mode',delivery:'Delivery Price',status:'Status'};
  return map[k]||k;
}
function showToast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--gold);color:#111;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function scrollChatToBottom(){

function renderChatModal(orderId){
  const o = orders.find(x=>x.id===orderId);

    <input type="file" id="chat_file_${orderId}" style="display:none" onchange="handleChatFileAttach(event, '${orderId}')">
    <input id="chat_input" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') sendChatMessage('${orderId}')">
    <button class="btn small" onclick="sendChatMessage('${orderId}')">Send</button>
  </div>
  `;

function handleChatFileAttach(e, orderId){
  const file = e.target.files[0];
  if(!file) return;
  const o = orders.find(x=>x.id===orderId);
  const now = new Date();
  const t = now.toLocaleString('en-US',{weekday:'short',month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'});
  o.chat = o.chat || [];
  if(file.type.startsWith('image/')){
    const reader = new FileReader();
    reader.onload = function(ev){
      o.chat.push({from:'officer', text:`📎 ${file.name}`, image:ev.target.result, t});
      document.getElementById('chatModalContent').innerHTML = renderChatModal(orderId);
      scrollChatToBottom();
      showToast('File attached and sent to achiever.');
    };
    reader.readAsDataURL(file);
  } else {
    o.chat.push({from:'officer', text:`📎 ${file.name}`, t});
    document.getElementById('chatModalContent').innerHTML = renderChatModal(orderId);
    scrollChatToBottom();
    showToast('File attached and sent to achiever.');
  }
}
async function sendChatMessage(orderId){
  const input = document.getElementById('chat_input');
  const text = input.value.trim();
  if(!text) return;
  const o = orders.find(x=>x.id===orderId);
  const now = new Date();
  const t = now.toLocaleString('en-US',{weekday:'short',month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'});
  o.chat = o.chat || [];
  o.chat.push({from:'officer', text, t});
  pushChatMessage(orderId, 'officer', text);
  const notify = document.getElementById('chat_notify').checked;
  input.value='';
  document.getElementById('chatModalContent').innerHTML = renderChatModal(orderId);
  scrollChatToBottom();
  refreshBell();
  if(notify){
    showToast('Sending SMS to achiever...');
    const result = await sendSMS(o.phone, text);
    const now2 = new Date();
    const activityTime = now2.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    if(result.ok){
      o.activity.push({t: activityTime, text: 'SMS sent to achiever (via chat)', diff: text});
      showToast('Message sent to achiever via SMS.');
    } else if(result.reason === 'invalid_phone'){
      o.activity.push({t: activityTime, text: 'SMS not sent — no valid phone number on file', diff: text});
      showToast(`Could not send SMS — no valid phone number on file for ${o.achiever}.`);
    } else {
      o.activity.push({t: activityTime, text: 'SMS failed to send (via chat)', diff: text});
      showToast('SMS failed to send (this preview environment may block outside API calls — this will work once wired into your Apps Script backend).');
    }
  }
}

function runCalc(){
  const qty = Number(document.getElementById('calc_qty').value)||0;
  const price = Number(document.getElementById('calc_price').value)||0;
  const disc = Number(document.getElementById('calc_discount').value)||0;
  const delivery = Number(document.getElementById('calc_delivery').value)||0;
  const subtotal = qty*price;
  const discountAmt = subtotal*(disc/100);
  const total = (subtotal - discountAmt) + delivery;
  const perUnit = qty ? (total/qty) : 0;
  document.getElementById('calc_result').innerHTML = `
    <div class="flex-between" style="margin-bottom:6px;"><span class="muted">Subtotal</span><b>GH₵${subtotal.toFixed(2)}</b></div>

  `;
}

function viewServiceManual(){
  return `
  <div class="panel">
    <h3>Service Manual <button class="btn small" onclick="openAddManualModal()">+ Add Entry</button></h3>
    <div class="toolbar"><input id="manual_search" placeholder="Search questions..." oninput="renderManualList()"></div>
    <div id="manualListContainer"></div>
  </div>
  `;
}
function renderManualList(){
  const container = document.getElementById('manualListContainer');
  if(!container) return;
  const q = (document.getElementById('manual_search')?.value || '').toLowerCase();
  const filtered = manualEntries.filter(e => e.q.toLowerCase().includes(q));
  container.innerHTML = `
  <table>
    <tr><th>Question</th><th>Category</th><th></th></tr>
    ${filtered.map((e,idx)=>`
      <tr>
        <td><b>${e.q}</b><div class="muted" style="font-size:12px;margin-top:4px;">${e.a || '<i>No saved answer yet</i>'}</div></td>
        <td><span class="pill">${e.category}</span></td>
        <td><button class="btn small ghost" onclick="insertManualIntoChatHint('${idx}')">Copy</button></td>
      </tr>
    `).join('') || `<tr><td colspan="3" class="muted" style="text-align:center;padding:20px 0;">No matching entries.</td></tr>`}
  </table>
  `;
}
function insertManualIntoChatHint(idx){
  const entry = manualEntries[idx];
  navigator.clipboard?.writeText(entry.a || entry.q);
  showToast('Answer copied — paste it into the chat box.');
}
function openAddManualModal(){
  document.getElementById('enquiryModalContent').innerHTML = `
    <div class="modal-head"><h3 style="color:var(--gold);">Add Manual Entry</h3><button class="close-x" onclick="closeEnquiryModal()">✕</button></div>
    <div class="field"><label>Question</label><input id="man_q" placeholder="e.g. Do you offer refunds?"></div>
    <div class="field"><label>Category</label><input id="man_cat" placeholder="e.g. Refunds"></div>
    <div class="field"><label>Answer</label><textarea id="man_a" placeholder="Type the standard response..."></textarea></div>
    <button class="btn" style="width:100%;" onclick="saveManualEntry()">Save Entry</button>
  `;
  document.getElementById('enquiryModalBg').classList.add('open');
}
function saveManualEntry(){
  const q = document.getElementById('man_q').value.trim();
  if(!q){ showToast('Please enter a question.'); return; }
  manualEntries.push({q, a:document.getElementById('man_a').value, category:document.getElementById('man_cat').value || 'General'});
  closeEnquiryModal();
  switchTab('Service Manual');
  showToast('Manual entry added.');
}

/* ---------------- NOTIFICATION BELL (unread achiever messages) ---------------- */
function getUnreadThreads(){
  return orders.filter(o => o.chat && o.chat.length && o.chat[o.chat.length-1].from === 'achiever');
}
function refreshBell(){
  const unread = getUnreadThreads();
  const badge = document.getElementById('bellBadge');
  if(!badge) return;
  if(unread.length){
    badge.style.display = 'inline-block';
    badge.textContent = unread.length;
  } else {
    badge.style.display = 'none';
  }
}
function toggleBellPanel(){
  const panel = document.getElementById('bellPanel');
  if(panel.style.display === 'block'){
    panel.style.display = 'none';
    return;
  }
  const unread = getUnreadThreads();
  panel.innerHTML = unread.length ? unread.map(o => {
    const last = o.chat[o.chat.length-1];
    return `<div style="padding:12px 14px;border-bottom:1px solid #201e1a;cursor:pointer;" onclick="toggleBellPanel(); openChat('${o.id}')">
      <div style="font-weight:600;font-size:12.5px;">${o.achiever}</div>
      <div class="muted" style="font-size:11.5px;margin:3px 0;">Order ${o.id}</div>
      <div style="font-size:12px;">${last.text.slice(0,60)}${last.text.length>60?'...':''}</div>
    </div>`;
  }).join('') : `<div class="muted" style="padding:16px;text-align:center;font-size:12.5px;">No new messages.</div>`;
  panel.style.display = 'block';
}
document.addEventListener('click', function(e){
  const panel = document.getElementById('bellPanel');
  const bell = document.getElementById('bellBtn');
  if(panel && panel.style.display === 'block' && !panel.contains(e.target) && e.target !== bell){
    panel.style.display = 'none';
  }
});

/* ---------------- LIVE BACKEND ---------------- */
const ORDERS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbz9ci17J8pw0n_bbWUMZ4nOaeoxk8f6ArbbC6tEoOIIM18ZT6DXraNtm2P-XoMIluvA9w/exec';

async function loadOrdersFromBackend(){
  if(!ORDERS_ENDPOINT) return;
  setSyncStatus('syncing');
  try{
    const res = await fetch(`${ORDERS_ENDPOINT}?action=getOrders`);
    const data = await res.json();
    if(data.ok && Array.isArray(data.orders)){
      orders = data.orders; // always reflect the Sheet, even if it's empty — stale demo data would be misleading
      renderMain();
      refreshBell();
      setSyncStatus('synced', new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}));
    } else {
      setSyncStatus('error');
    }
  }catch(err){
    console.warn('Could not reach orders backend:', err);
    setSyncStatus('error');
  }
}

async function pushStatus(id, status){
  if(!ORDERS_ENDPOINT) return;
  try{
    await fetch(ORDERS_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'updateStatus', id, status })
    });
  }catch(err){
    console.warn('Could not reach orders backend:', err);
  }
}

async function pushFields(id, fields){
  if(!ORDERS_ENDPOINT) return;
  try{
    await fetch(ORDERS_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'updateFields', id, fields })
    });
  }catch(err){
    console.warn('Could not reach orders backend:', err);
  }
}

async function pushChatMessage(id, from, text){
  if(!ORDERS_ENDPOINT) return;
  try{
    await fetch(ORDERS_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'sendMessage', id, from, text })
    });
  }catch(err){
    console.warn('Could not reach orders backend:', err);
  }
}
